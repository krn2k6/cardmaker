<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little form</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-sizing: border-box;
            user-select: none;
        }

        html,
        body{
            width: 100%;
            height: 100%;
        }

        input{
            display: block;
            padding: 5px;
        }

        #body{
            width: 100%;
            height: 20%;
            padding: 30px;
            background-color: #ffffff;
            font-weight: 100px;
            margin: 10px;
        }

        .card{
            max-width: 300px;
            background-color: grey;
            padding: 10px;
            border: 1px solid #5555;
            display: inline-block;
            margin: 50px;
            border-radius: 10px;
            color: white;
        }
        .profile{
            width: 50px;
            height: 50px;
            /* background-color: red; */
            border-radius: 50%;
            margin-bottom: 7px;
            /* overflow: hidden; */
             /* border: 2px solid red; temporary test */
            /* display: flex; */
        }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* overflow: hidden; */
            /* overflow: hidden; */
        }

        .card h4{
            font-size: 12px;
            margin-top: 10px;
        }
        .card h5{
            margin-top: 5px;
        }

    </style>
</head>
<body>
<div id="body">
    <form action="">
        <input type="text" placeholder="Profile pic">
        <input type="text" placeholder="Name">
        <input type="text" placeholder="Occupation">
        <input type="text" placeholder="Information">
        <input type="submit">
    </form>
</div>

    
    <script src="index.js"></script>
</body>
</html>
